<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rectangle -->
  <rect x="0" y="0" width="100" height="100" rx="10" ry="10" fill="#90ee90" />

  <!-- Rectangle vert -->
